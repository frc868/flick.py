name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/frc868/flick.py:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TOKEN
          script: |
            cd /srv/flick

            git fetch origin
            git reset --hard origin/main

            docker compose -p flick -f docker-compose.yml pull
            TOKEN="$TOKEN" docker compose -p flick -f docker-compose.yml up -d --remove-orphans